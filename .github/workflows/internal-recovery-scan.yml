name: Internal Recovery Scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Explicit production endpoint for scoped deployment verification"
        required: true
      mode:
        description: "identity or recovery"
        required: true
        default: "identity"

permissions: {}

concurrency:
  group: internal-recovery-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production through existing operator authentication
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
        run: |
          node <<'JS'
          const url = new URL(process.env.ENDPOINT);
          const mode = process.env.MODE;
          const route = mode === 'identity'
            ? '/api/internal/inspection/release-identity'
            : mode === 'recovery' ? '/api/internal/recovery/scan' : null;
          if (!route || url.protocol !== 'https:' || url.pathname !== route || url.search ||
              !/^(say-hear-web|say-hear-[a-z0-9]+-lukemyself)\.vercel\.app$/.test(url.hostname)) {
            throw new Error('Only the scoped production verification endpoint is allowed');
          }
          const response = await fetch(url, {
            headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET },
            signal: AbortSignal.timeout(120000), redirect: 'error',
          });
          if (response.status !== 200) throw new Error('Operator request failed HTTP ' + response.status);
          const body = await response.json();
          if (mode === 'identity') {
            const allowed = ['version','commit','environment','projectId','teamId','businessTargetHash','purgeMarkerTargetHash'];
            if (Object.keys(body).length !== allowed.length || allowed.some(k => typeof body[k] !== 'string') ||
                body.projectId !== 'prj_KJD7fJhlIxlOMc4W4goUsIhOaLly' || body.environment !== 'production' ||
                !/^[a-f0-9]{40}$/.test(body.commit) ||
                !/^[a-f0-9]{64}$/.test(body.businessTargetHash) || !/^[a-f0-9]{64}$/.test(body.purgeMarkerTargetHash)) {
              throw new Error('Unexpected content-free production identity');
            }
            console.log('RELEASE_IDENTITY ' + JSON.stringify(body));
          } else {
            const counters = {};
            for (const [group, values] of Object.entries(body)) {
              if (!/^[A-Za-z]+$/.test(group) || !values || typeof values !== 'object') throw new Error('Unexpected scan group');
              counters[group] = {};
              for (const [key, value] of Object.entries(values)) {
                if (!/^[A-Za-z]+$/.test(key) || !Number.isSafeInteger(value) || value < 0) throw new Error('Unexpected scan counter');
                counters[group][key] = value;
              }
            }
            console.log('RECOVERY_SCAN ' + JSON.stringify(counters));
          }
          console.log('time=' + new Date().toISOString() + ' status=200');
          JS
